<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Watercolor dot">
  <!-- Self-contained bleed: same feTurbulence/feDisplacement family as the site's
       #bleed filter (default.html), retuned for a 32px dot so the edge frays wet,
       not shredded. Favicon SVGs can't url() an external filter, so it lives here. -->
  <defs>
    <filter id="fav-bleed" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>
  <!-- Layered palette washes (teal / lav / peach), overlapping and semi-opaque so
       the pigments pool where they cross — the wet-on-wet watercolor look. -->
  <g filter="url(#fav-bleed)">
    <circle cx="15" cy="14" r="8.5" fill="#2fa79b" opacity="0.85"/>
    <circle cx="18" cy="18" r="7.5" fill="#7b57c8" opacity="0.7"/>
    <circle cx="14" cy="19" r="6.5" fill="#e8734e" opacity="0.6"/>
  </g>
</svg>
