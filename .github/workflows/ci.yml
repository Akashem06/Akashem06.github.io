name: CI / Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily rebuild so the GitHub contribution heatmap / pinned repos stay fresh
  # even with no content push. Manual trigger available too.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fetch public GitHub data (heatmap + pinned repos)
        run: ruby script/fetch_github.rb
        env:
          # Actions' built-in token works for public GraphQL fields. Set a GH_PAT
          # secret (classic, read:user) if the contribution calendar comes back empty.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Persist the last successful Substack fetch. Cloudflare 403s runner IPs on the
      # direct feed, so the build leans on flaky public proxies; when they're all down
      # the fetch script exits without overwriting _data/substack.json, and this cache
      # feeds it the previous good posts instead of the empty state. Unique key per run
      # saves a fresh snapshot each time; restore-keys grabs the most recent prior one.
      - name: Restore last good Substack data
        uses: actions/cache@v4
        with:
          path: _data/substack.json
          key: substack-${{ github.run_id }}
          restore-keys: |
            substack-
      - name: Fetch Substack posts (public RSS)
        run: ruby script/fetch_substack.rb
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Validate HTML, links, and image alts
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --no-enforce-https
      - name: Check required frontmatter
        run: ruby script/check_frontmatter.rb
      - name: Warn on oversized images
        run: |
          find assets/images -type f \( -iname '*.jpg' -o -iname '*.png' -o -iname '*.webp' \) \
            -size +400k -printf 'OVERSIZED: %p (%k KB)\n' || true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fetch public GitHub data (heatmap + pinned repos)
        run: ruby script/fetch_github.rb
        env:
          # Actions' built-in token works for public GraphQL fields. Set a GH_PAT
          # secret (classic, read:user) if the contribution calendar comes back empty.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # See the matching step in the validate job: feeds the last successful Substack
      # fetch back in so a proxy outage ships stale-but-real posts, not the empty state.
      - name: Restore last good Substack data
        uses: actions/cache@v4
        with:
          path: _data/substack.json
          key: substack-${{ github.run_id }}
          restore-keys: |
            substack-
      - name: Fetch Substack posts (public RSS)
        run: ruby script/fetch_substack.rb
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
