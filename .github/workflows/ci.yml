name: CI / Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily rebuild so the GitHub contribution heatmap / pinned repos stay fresh
  # even with no content push. Manual trigger available too.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fetch public GitHub data (heatmap + pinned repos)
        run: ruby script/fetch_github.rb
        env:
          # Actions' built-in token works for public GraphQL fields. Set a GH_PAT
          # secret (classic, read:user) if the contribution calendar comes back empty.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Validate HTML, links, and image alts
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --check-img-http \
            --enforce-https=false
      - name: Check required frontmatter
        run: ruby script/check_frontmatter.rb
      - name: Warn on oversized images
        run: |
          find assets/images -type f \( -iname '*.jpg' -o -iname '*.png' -o -iname '*.webp' \) \
            -size +400k -printf 'OVERSIZED: %p (%k KB)\n' || true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fetch public GitHub data (heatmap + pinned repos)
        run: ruby script/fetch_github.rb
        env:
          # Actions' built-in token works for public GraphQL fields. Set a GH_PAT
          # secret (classic, read:user) if the contribution calendar comes back empty.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
