<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme preview — pick a palette</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 80px;
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #e9e4da; color: #2a2622;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b645b; margin: 0 0 28px; max-width: 60ch; }
  .grid { display: grid; gap: 22px; max-width: 1100px; margin: 0 auto; }
  .theme { }
  .theme > .name { font-weight: 700; font-size: 16px; margin: 0 0 2px; }
  .theme > .desc { color: #6b645b; font-size: 13px; margin: 0 0 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px){ .pair { grid-template-columns: 1fr; } }

  /* a mock renders your real UI from the theme's tokens */
  .mock {
    --on-accent: #fff;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .mock .modelabel {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .mock .swatches { display: flex; gap: 6px; margin: 2px 0 14px; }
  .mock .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); }
  .mock .nav {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--paper-elev); border: 1px solid var(--line);
    border-radius: 999px; margin-bottom: 14px;
  }
  .mock .nav span { padding: 4px 11px; border-radius: 999px; font-size: 12px; color: var(--ink-soft); }
  .mock .nav span.on { background: var(--accent); color: var(--on-accent); }
  .mock .kicker { color: var(--accent); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .mock h3 { margin: 4px 0 6px; font-size: 20px; line-height: 1.15; }
  .mock p { margin: 0 0 12px; color: var(--ink-soft); font-size: 13px; }
  .mock a.link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
  .mock .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .mock .btn {
    background: var(--accent-deep); color: var(--on-accent);
    border: none; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: default;
  }
  .mock .tag {
    background: var(--pop-bg); color: var(--accent);
    border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 600;
  }
  .mock .card {
    margin-top: 14px; background: var(--paper-elev);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .mock .card b { font-size: 13px; }
  .mock .card small { color: var(--ink-soft); display: block; margin-top: 2px; font-size: 12px; }
  .bloom {
    position: absolute; inset: auto -30px -40px auto; width: 160px; height: 160px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    opacity: .16; pointer-events: none;
  }
</style>
</head>
<body>
  <h1>Theme preview — pick a palette</h1>
  <p class="sub">Each row is one theme in light + dark, rendered as a mini mock of your real UI. Swapping to any of these = re-pointing the 7 paint tokens in <code>main.css</code>. Row 1 is your <b>current</b> theme, for comparison. Tell me a number and I'll wire it in.</p>
  <div class="grid" id="grid"></div>

<script>
// [name, desc, lightTokens, darkTokens]
// tokens: paper, elev, ink, inkSoft, accent, accentDeep, line, popBg
const T = [
  ["1 · Plum & Paper  (current)", "Your shipped theme — warm cold-press paper, graphite ink, plum accent; candlelit coral in the dark.",
    ["#f7f2e9","#fffdf8","#272220","#766b62","#6a4d88","#543c6e","#e4dac9","rgba(106,77,136,.10)"],
    ["#1c1815","#262019","#f2ece0","#a89c8d","#ef9a7a","#e5825a","#3a322a","rgba(239,154,122,.18)"]],

  ["2 · Pine & Paper", "Same warm paper, but a deep pine-teal accent instead of plum. Calmer, more 'engineer's notebook'.",
    ["#f6f2e8","#fffdf7","#23211d","#6f6a5f","#2f7d6b","#245e50","#e3dcc9","rgba(47,125,107,.10)"],
    ["#16191a","#1f2324","#ecefe9","#97a29a","#5cc4a8","#47a88d","#2c3231","rgba(92,196,168,.18)"]],

  ["3 · Terracotta & Sandstone", "Earthier, warmer canvas with a burnt-orange accent — Mediterranean/travel energy (Madrid, sun).",
    ["#f4ece0","#fdf7ec","#2b211a","#7a6a5a","#c1502e","#9e3d20","#e6d8c4","rgba(193,80,46,.10)"],
    ["#1e1712","#29201a","#f1e7db","#ab9a88","#f08a5d","#e0714a","#3c2f24","rgba(240,138,93,.18)"]],

  ["4 · Olive & Bone", "Off-white bone paper, olive/sage accent. Reads like a gallery wall — great for the photo/art side.",
    ["#f4f1e6","#fdfbf2","#262620","#6d6c5d","#6b7a3a","#55622c","#e2ddca","rgba(107,122,58,.12)"],
    ["#191a15","#22241d","#edeee2","#9ba08c","#adc06a","#97ab52","#2f322a","rgba(173,192,106,.18)"]],

  ["5 · Oxblood & Oat", "Editorial: cool-oat paper, deep oxblood/crimson accent (nods to your old crimson). Confident, print-mag.",
    ["#f7f3ec","#fffcf6","#241f1d","#746b64","#9e2b2b","#7d2020","#e6dccd","rgba(158,43,43,.10)"],
    ["#1b1614","#241d1a","#f1e9e2","#a89890","#e8746b","#db5b51","#392e29","rgba(232,116,107,.18)"]],

  ["6 · Indigo & Fog", "Cooler + more 'tech': a soft fog-grey light, deep indigo accent. Furthest from the warm-paper DNA.",
    ["#f2f2ee","#fbfbf7","#20222a","#676b78","#3b4ea8","#2d3d88","#dcdcd6","rgba(59,78,168,.10)"],
    ["#14161c","#1d2028","#e9ebf2","#939aab","#8b9df0","#7284e6","#2a2e38","rgba(139,157,240,.18)"]],
];

const keys = ["--paper","--paper-elev","--ink","--ink-soft","--accent","--accent-deep","--line","--pop-bg"];
function style(t){ return keys.map((k,i)=>`${k}:${t[i]}`).join(";"); }

function mock(tokens, label){
  const sw = tokens.slice(0,7).map(c=>`<span class="sw" style="background:${c}"></span>`).join("");
  return `<div class="mock" style="${style(tokens)}">
    <div class="bloom"></div>
    <span class="modelabel">${label}</span>
    <div class="swatches">${sw}</div>
    <div class="nav"><span class="on">Home</span><span>Blog</span><span>Projects</span><span>Art</span></div>
    <div class="kicker">Embedded · firmware</div>
    <h3>Aryan Kashem</h3>
    <p>Engineer who draws. I document firmware, finance abroad, and the road.</p>
    <a class="link">Read the latest post →</a>
    <div class="row">
      <button class="btn">View work</button>
      <span class="tag">travel</span>
      <span class="tag">embedded</span>
    </div>
    <div class="card"><b>Midnight Sun — vehicle firmware</b><small>C · STM32 · CAN — 2025</small></div>
  </div>`;
}

document.getElementById("grid").innerHTML = T.map(([name,desc,l,d])=>`
  <div class="theme">
    <p class="name">${name}</p>
    <p class="desc">${desc}</p>
    <div class="pair">${mock(l,"Light")}${mock(d,"Dark")}</div>
  </div>`).join("");
</script>
</body>
</html>
